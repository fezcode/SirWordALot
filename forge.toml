[app]
name    = "Sir Word-a-lot"
version = "0.1.3"
id      = "io.fezcode.sirwordalot"
icon    = "Assets/SirWordALot.ico"

[meta]
publisher = "Samil Bulbul"
comments  = "Vocabulary and thesaurus trainer with spaced repetition"

[ui]
# huh is the only shipped theme that asks the engine for a real Mica backdrop,
# so the wizard picks up the desktop tint behind it instead of painting its own
# ground. It lays the steps out as a rail down the left.
theme        = "huh"
window_title = "Sir Word-a-lot Setup"

[install]
default_dir = "${LOCALAPPDATA}/Programs/SirWordALot"

# Everything under ${INSTALLDIR} is app payload and goes on uninstall. The library
# itself — library.db and its backups — lives in %APPDATA%\fezcode\SirWordALot and
# is only removed when the user ticks "Also remove my settings and data".
[uninstall]
settings_dirs = ["${APPDATA}/fezcode/SirWordALot"]

# Step titles double as the labels in huh's left rail, so they are short. The
# rail already heads itself with the app name and version, and each body carries
# the version where it matters; version.ps1 rewrites those on a bump. Do not put
# a version number in a comment here — version.ps1 will not rewrite it and it
# will drift.
[[steps]]
type  = "welcome"
title = "Welcome"
body  = "This wizard will install Sir Word-a-lot 0.1.3 on your computer.\n\nSir Word-a-lot is a vocabulary and thesaurus trainer: capture a word with the sentence you met it in, enrich it with real synonyms and examples, then meet it again on a schedule until it sticks.\n\nClick Next to continue."

[[steps]]
type  = "license"
title = "License"
body  = "Please review the license terms below before continuing the installation."
file  = "LICENSE.txt"

[[steps]]
type  = "folder"
title = "Location"
body  = "Choose where to install Sir Word-a-lot 0.1.3."

[[steps]]
type  = "shortcuts"
title = "Shortcuts"
body  = "Check the items you would like the installer to perform."

[[steps]]
type  = "install"
title = "Installing"
body  = "Copying files to your system."

[[steps]]
type  = "finish"
title = "Finished"
body  = "Sir Word-a-lot has been installed successfully.\n\nYour library starts with sixty words, already due. Press Q for a quiz, or Ctrl+Space to go anywhere.\n\nClick Finish to close the installer."

[[steps.launches]]
kind    = "app"
target  = "${INSTALLDIR}/SirWordALot.exe"
label   = "Run Sir Word-a-lot after install"
checked = true

[[dirs]]
# installer.ps1 supports win-x64 only; keep this aligned with that payload.
src = "dist/SirWordALot"
dst = "${INSTALLDIR}"

[[files]]
src = "LICENSE.txt"
dst = "${INSTALLDIR}/LICENSE.txt"

# Shortcut icons point at the executable, which carries the icon as a resource.
# Do not add a [[files]] entry for Assets/SirWordALot.ico to copy an app.ico
# beside it: Forge stages [app] icon first as bundle-only and then dedups
# [[files]] by source path, so the copy is silently dropped and the shortcuts
# end up pointing at a file that was never written.
[[shortcuts]]
target   = "${INSTALLDIR}/SirWordALot.exe"
location = "${DESKTOP}/Sir Word-a-lot.lnk"
name     = "Sir Word-a-lot"
icon     = "${INSTALLDIR}/SirWordALot.exe"
label    = "Create Desktop Shortcut"
optional = true
default  = true

[[shortcuts]]
target   = "${INSTALLDIR}/SirWordALot.exe"
location = "${STARTMENU}/Sir Word-a-lot/Sir Word-a-lot.lnk"
name     = "Sir Word-a-lot"
icon     = "${INSTALLDIR}/SirWordALot.exe"
label    = "Create Start Menu Entry"
optional = true
default  = true

[[registry]]
hive  = "HKCU"
key   = "Software\\fezcode\\SirWordALot"
value = "InstallDir"
data  = "${INSTALLDIR}"

[[registry]]
hive  = "HKCU"
key   = "Software\\fezcode\\SirWordALot"
value = "Version"
data  = "0.1.3"
